<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rufus vs Computer - Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Rufus vs Computer</h1>
        
        <div class="game-mode">
            <button class="mode-btn active" onclick="setGameMode(3)">3x3</button>
            <button class="mode-btn" onclick="setGameMode(4)">4x4</button>
        </div>

        <div class="game-info">
            <p>Rufus: <span id="playerSymbol" class="x">X</span></p>
            <p>Computer: <span id="computerSymbol" class="o">O</span></p>
            <p id="status">Rufus's turn...</p>
        </div>
        <div class="board" id="board">
            <!-- Cells will be generated by JavaScript -->
        </div>
        <button class="reset-btn" onclick="resetGame()">New Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
